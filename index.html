    <!-- HTML5 History API Fallback for SPA routing -->
    <script type="text/javascript">
      (function() {
        // This script handles SPA routing fallback for servers that don't support rewrites
        // It checks if we're on a deep link and the page hasn't loaded React yet
        var defined_routes = ['/', '/miss-election', '/mediatheque', '/heros-kwatt', '/admin'];
        var path = window.location.pathname;
        
        // Only run if we're on a defined route (not a 404 for static assets)
        var isDefinedRoute = defined_routes.some(function(route) {
          return path === route || path.startsWith(route + '/');
        });
        
        // Store the intended path for React Router to pick up
        if (isDefinedRoute && path !== '/') {
          sessionStorage.setItem('spa_redirect_path', path + window.location.search + window.location.hash);
        }
      })();
    </script>
