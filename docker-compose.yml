version: "3.8"

services:
  douala-fiesta:
    build:
      context: .
      args:
        # Lues depuis le .env à côté de ce fichier (voir .env.example) —
        # à remplir avec l'URL et la clé anon du Supabase self-hosted déployé
        # séparément (service "supabase-selfhost"), une fois qu'il tourne.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    image: douala-fiesta:latest
    restart: unless-stopped
    networks:
      - dokploy-network
    # Pas de labels Traefik ici : sur Dokploy, le routage (domaine, port,
    # certificat) se configure entièrement via l'onglet "Domains" de ce
    # service dans l'UI — des labels manuels en plus créent un routeur en
    # double du même nom et cassent le routage. Si ce compose est un jour
    # déployé hors Dokploy (Traefik "nu"), il faudra réintroduire des labels
    # traefik.* ici.

networks:
  dokploy-network:
    external: true
    name: dokploy-network
