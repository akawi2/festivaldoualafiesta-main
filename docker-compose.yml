version: "3.8"

services:
  douala-fiesta:
    build:
      context: .
      args:
        # Lues depuis le .env à côté de ce fichier (voir .env.example) —
        # à remplir avec l'URL et la clé anon du Supabase self-hosted déployé
        # séparément (service "supabase-selfhost"), une fois qu'il tourne.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    image: douala-fiesta:latest
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.douala-fiesta.rule=Host(`festivaldoualafiesta.cm`) || Host(`www.festivaldoualafiesta.cm`)"
      - "traefik.http.routers.douala-fiesta.entrypoints=websecure"
      - "traefik.http.routers.douala-fiesta.tls.certresolver=letsencrypt"
      - "traefik.http.services.douala-fiesta.loadbalancer.server.port=80"
      # Redirection HTTP -> HTTPS
      - "traefik.http.routers.douala-fiesta-http.rule=Host(`festivaldoualafiesta.cm`) || Host(`www.festivaldoualafiesta.cm`)"
      - "traefik.http.routers.douala-fiesta-http.entrypoints=web"
      - "traefik.http.routers.douala-fiesta-http.middlewares=douala-fiesta-redirect"
      - "traefik.http.middlewares.douala-fiesta-redirect.redirectscheme.scheme=https"

networks:
  dokploy-network:
    external: true
    name: dokploy-network
