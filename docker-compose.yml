version: "3.8"

services:
  douala-fiesta:
    build:
      context: .
      args:
        # Lues depuis le .env à côté de ce fichier (voir .env.example) —
        # à remplir avec l'URL et la clé anon du Supabase self-hosted déployé
        # séparément (service "supabase-selfhost"), une fois qu'il tourne.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    image: douala-fiesta:latest
    restart: unless-stopped
    networks:
      - dokploy-network
    # No Traefik labels here: this server's Traefik runs in Docker Swarm
    # mode and only discovers routes registered through Dokploy's own
    # "Domains" tab per service (Compose/port/domain) — it never reads
    # traefik.* labels on plain docker-compose containers. Configure the
    # domain there (port 80). Attached to dokploy-network (Dokploy's own
    # overlay network) since its Domains-tab routing needs the container
    # reachable there. If this compose is ever deployed on a plain Traefik
    # (non-Swarm, label-based discovery) host instead, labels will need to
    # be reintroduced and the network changed back to an external "proxy".

networks:
  dokploy-network:
    external: true
